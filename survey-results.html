<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Survey Results - Wings of Discovery</title>
    <script src="shared-layout.js"></script>
    <style>
      .content {
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .results-header {
        text-align: center;
        margin-bottom: 40px;
      }

      .results-header h1 {
        color: #8a3edb;
        font-size: 2.2em;
        margin-bottom: 10px;
      }

      .results-header p {
        color: #666;
        font-size: 1.1em;
        line-height: 1.6;
      }

      .results-container {
        background: white;
        border-radius: 15px;
        padding: 30px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        margin-bottom: 30px;
      }

      .iframe-wrapper {
        width: 100%;
        min-height: 600px;
        border-radius: 10px;
        overflow: hidden;
      }

      .iframe-wrapper iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      .back-link {
        display: inline-block;
        margin-bottom: 20px;
        color: #8a3edb;
        text-decoration: none;
        font-weight: 600;
        font-size: 1.05em;
        transition: all 0.3s ease;
      }

      .back-link:hover {
        color: #6a2eab;
        transform: translateX(-5px);
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header-placeholder"></div>

      <div class="content">
        <a href="learn-archaeology.html" class="back-link"
          >← Back to Learn Archaeology</a
        >

        <div class="results-header">
          <h1>📊 Survey Results</h1>
          <p>
            Here's what people think about our Wings of Discovery project and
            the solutions we've built to help archaeologists!
          </p>
        </div>

        <div class="results-container">
          <div class="iframe-wrapper">
            <iframe
              src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTCTdWifpmz3pDVMdXcf6pCTC0NOdn6S7fWajDrYgbmp3NooD1a_vEWG3JP82QnWitRmcbf7GkLh7y0/pubhtml?widget=true&amp;headers=false"
            ></iframe>
          </div>
        </div>
      </div>

      <div class="footer-placeholder"></div>
    </div>
  </body>
</html>
