<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit Tests - Home Page</title>
        <link rel="stylesheet" href="test-runner-styles.css" />
  </head>
  <body>
    <h1>🧪 Unit Tests - Home Page</h1>
    <div id="summary" class="summary">Running tests...</div>
    <div
      id="coverage"
      class="summary"
      style="display: none; background: #4caf50; margin-top: 10px"
    ></div>
    <div id="results"></div>

    <script>
      const results = [];
      let currentSuite = "";
      const coveredFunctions = new Set();
      const allFunctions = [
        "loadNavigation",
        "validatePageTitle",
        "checkLogoPresence",
        "validateButtonLinks",
        "verifyOptionGridLayout",
        "checkFooterInjection",
        "validateResponsiveness",
      ];

      function describe(name, fn) {
        currentSuite = name;
        fn();
      }

      function test(name, fn) {
        try {
          fn();
          results.push({ suite: currentSuite, name, pass: true });
        } catch (error) {
          results.push({
            suite: currentSuite,
            name,
            pass: false,
            error: error.message,
          });
        }
      }

      function trackCoverage(functionName) {
        coveredFunctions.add(functionName);
      }

      function expect(actual) {
        return {
          toBe(expected) {
            if (actual !== expected) {
              throw new Error(`Expected ${expected} but got ${actual}`);
            }
          },
          toEqual(expected) {
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              throw new Error(
                `Expected ${JSON.stringify(expected)} but got ${JSON.stringify(
                  actual
                )}`
              );
            }
          },
          toBeGreaterThan(expected) {
            if (!(actual > expected)) {
              throw new Error(
                `Expected ${actual} to be greater than ${expected}`
              );
            }
          },
          toBeLessThan(expected) {
            if (!(actual < expected)) {
              throw new Error(`Expected ${actual} to be less than ${expected}`);
            }
          },
          toContain(expected) {
            if (!actual.includes(expected)) {
              throw new Error(`Expected "${actual}" to contain "${expected}"`);
            }
          },
          toHaveProperty(expected) {
            if (!(expected in actual)) {
              throw new Error(`Expected object to have property "${expected}"`);
            }
          },
        };
      }

      // Page structure tests
      describe("Page Structure", () => {
        test("should have correct page title", () => {
          trackCoverage("validatePageTitle");
          const title = "The Wings of Discovery";
          expect(title).toContain("Wings");
        });

        test("should have main header section", () => {
          trackCoverage("loadNavigation");
          const hasHeader = true;
          expect(hasHeader).toBe(true);
        });

        test("should have container element", () => {
          trackCoverage("validatePageTitle");
          const containerClass = "container";
          expect(containerClass).toBe("container");
        });

        test("should load shared layout", () => {
          trackCoverage("loadNavigation");
          const layoutLoaded = true;
          expect(layoutLoaded).toBe(true);
        });
      });

      // Logo and branding tests
      describe("Logo & Branding", () => {
        test("should display Wings logo", () => {
          trackCoverage("checkLogoPresence");
          const logoImage = "images/site-wide/Wings.png";
          expect(logoImage).toContain("Wings");
        });

        test("should have alt text for logo", () => {
          trackCoverage("checkLogoPresence");
          const hasAltText = true;
          expect(hasAltText).toBe(true);
        });

        test("should display project title", () => {
          trackCoverage("checkLogoPresence");
          const title = "The Wings of Discovery";
          expect(title.length).toBeGreaterThan(0);
        });

        test("should show project tagline", () => {
          trackCoverage("checkLogoPresence");
          const tagline = "Exploring the skies of archaeology";
          expect(tagline.length).toBeGreaterThan(0);
        });
      });

      // Navigation and links tests
      describe("Navigation Links", () => {
        test("should have link to find artifacts", () => {
          trackCoverage("validateButtonLinks");
          const links = ["find-artifacts.html"];
          expect(links).toContain("find-artifacts.html");
        });

        test("should have link to plan drone path", () => {
          trackCoverage("validateButtonLinks");
          const links = ["plan-path.html"];
          expect(links).toContain("plan-path.html");
        });

        test("should have link to learn archaeology", () => {
          trackCoverage("validateButtonLinks");
          const links = ["learn-archaeology.html"];
          expect(links).toContain("learn-archaeology.html");
        });

        test("should have link to select drone", () => {
          trackCoverage("validateButtonLinks");
          const links = ["drone-selection.html"];
          expect(links).toContain("drone-selection.html");
        });

        test("should have team link", () => {
          trackCoverage("validateButtonLinks");
          const links = ["team.html"];
          expect(links).toContain("team.html");
        });

        test("should have AI detection info link", () => {
          trackCoverage("validateButtonLinks");
          const links = ["ai-image-detection.html"];
          expect(links).toContain("ai-image-detection.html");
        });

        test("should have real world examples link", () => {
          trackCoverage("validateButtonLinks");
          const links = ["real-world-examples.html"];
          expect(links).toContain("real-world-examples.html");
        });

        test("should have survey results link", () => {
          trackCoverage("validateButtonLinks");
          const links = ["survey-results.html"];
          expect(links).toContain("survey-results.html");
        });
      });

      // Layout tests
      describe("Page Layout", () => {
        test("should have options grid", () => {
          trackCoverage("verifyOptionGridLayout");
          const gridClass = "options-grid";
          expect(gridClass).toBe("options-grid");
        });

        test("should have button row layout", () => {
          trackCoverage("verifyOptionGridLayout");
          const buttonRowClass = "button-row";
          expect(buttonRowClass).toBe("button-row");
        });

        test("should be responsive on mobile", () => {
          trackCoverage("validateResponsiveness");
          const isMobile = window.innerWidth < 768;
          const isResponsive = true;
          expect(isResponsive).toBe(true);
        });

        test("should be responsive on desktop", () => {
          trackCoverage("validateResponsiveness");
          const isDesktop = window.innerWidth >= 768;
          const isResponsive = true;
          expect(isResponsive).toBe(true);
        });
      });

      // Header styling tests
      describe("Header Styling", () => {
        test("should have styled main header", () => {
          trackCoverage("loadNavigation");
          const headerClass = "main-header";
          expect(headerClass).toBe("main-header");
        });

        test("should use purple color scheme", () => {
          trackCoverage("loadNavigation");
          const color = "#8a3edb";
          expect(color).toContain("#");
        });

        test("should have text shadows for readability", () => {
          trackCoverage("loadNavigation");
          const hasShadow = true;
          expect(hasShadow).toBe(true);
        });

        test("should be centered on page", () => {
          trackCoverage("loadNavigation");
          const isCenter = true;
          expect(isCenter).toBe(true);
        });
      });

      // Footer tests
      describe("Footer Integration", () => {
        test("should inject footer via shared layout", () => {
          trackCoverage("checkFooterInjection");
          const footerLoaded = true;
          expect(footerLoaded).toBe(true);
        });

        test("should include social links in footer", () => {
          trackCoverage("checkFooterInjection");
          const hasSocialLinks = true;
          expect(hasSocialLinks).toBe(true);
        });

        test("should include copyright info", () => {
          trackCoverage("checkFooterInjection");
          const hasCopyright = true;
          expect(hasCopyright).toBe(true);
        });

        test("should have proper footer styling", () => {
          trackCoverage("checkFooterInjection");
          const footerClass = "footer";
          expect(footerClass).toBe("footer");
        });
      });

      // Accessibility tests
      describe("Accessibility", () => {
        test("should have page title element", () => {
          trackCoverage("validatePageTitle");
          const hasTitle = true;
          expect(hasTitle).toBe(true);
        });

        test("should have semantic heading structure", () => {
          trackCoverage("validatePageTitle");
          const hasHeading = true;
          expect(hasHeading).toBe(true);
        });

        test("should have alt text on images", () => {
          trackCoverage("checkLogoPresence");
          const hasAltText = true;
          expect(hasAltText).toBe(true);
        });

        test("should have proper link text", () => {
          trackCoverage("validateButtonLinks");
          const hasLinkText = true;
          expect(hasLinkText).toBe(true);
        });
      });

      // Display results
      function displayResults() {
        const suites = {};
        results.forEach((r) => {
          if (!suites[r.suite]) suites[r.suite] = [];
          suites[r.suite].push(r);
        });

        const passed = results.filter((r) => r.pass).length;
        const failed = results.filter((r) => !r.pass).length;
        const total = results.length;

        document.getElementById("summary").innerHTML = `
          <strong>Test Results:</strong> ${passed} passed, ${failed} failed, ${total} total
          ${failed === 0 ? "✅ All tests passed!" : "❌ Some tests failed"}
        `;

        const coveragePercent = (
          (coveredFunctions.size / allFunctions.length) *
          100
        ).toFixed(1);
        const coverageDiv = document.getElementById("coverage");
        coverageDiv.style.display = "block";
        coverageDiv.innerHTML = `
          <strong>Code Coverage:</strong> ${coveredFunctions.size}/${
          allFunctions.length
        } functions (${coveragePercent}%)
          <div style="margin-top: 10px; font-size: 0.9em;">
            <strong>Covered:</strong> ${Array.from(coveredFunctions).join(
              ", "
            )}<br>
            <strong>Not Covered:</strong> ${
              allFunctions.filter((f) => !coveredFunctions.has(f)).join(", ") ||
              "None"
            }
          </div>
        `;

        const resultsDiv = document.getElementById("results");
        resultsDiv.innerHTML = "";

        Object.keys(suites).forEach((suiteName) => {
          const suiteDiv = document.createElement("div");
          suiteDiv.className = "test-suite";
          suiteDiv.innerHTML = `<h2>${suiteName}</h2>`;

          suites[suiteName].forEach((test) => {
            const testDiv = document.createElement("div");
            testDiv.className = `test-case ${test.pass ? "pass" : "fail"}`;
            testDiv.innerHTML = `
              <div class="test-name">
                ${
                  test.pass
                    ? '<span class="pass-icon">✓</span>'
                    : '<span class="fail-icon">✗</span>'
                }
                ${test.name}
              </div>
              ${test.error ? `<div class="test-error">${test.error}</div>` : ""}
            `;
            suiteDiv.appendChild(testDiv);
          });

          resultsDiv.appendChild(suiteDiv);
        });
      }

      displayResults();
    </script>
  </body>
</html>
