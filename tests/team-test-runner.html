<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit Tests - Team Page</title>
        <link rel="stylesheet" href="test-runner-styles.css" />
  </head>
  <body>
    <h1>🧪 Unit Tests - Team Page</h1>
    <div id="summary" class="summary">Running tests...</div>
    <div
      id="coverage"
      class="summary"
      style="display: none; background: #4caf50; margin-top: 10px"
    ></div>
    <div id="results"></div>

    <script>
      const results = [];
      let currentSuite = "";
      const coveredFunctions = new Set();
      const allFunctions = [
        "loadTeamData",
        "validateTeamMember",
        "renderTeamGrid",
        "validateMemberAvatar",
        "validateMemberRole",
        "displayTeamStats",
        "formatMemberBio",
      ];

      function describe(name, fn) {
        currentSuite = name;
        fn();
      }

      function test(name, fn) {
        try {
          fn();
          results.push({ suite: currentSuite, name, pass: true });
        } catch (error) {
          results.push({
            suite: currentSuite,
            name,
            pass: false,
            error: error.message,
          });
        }
      }

      function trackCoverage(functionName) {
        coveredFunctions.add(functionName);
      }

      function expect(actual) {
        return {
          toBe(expected) {
            if (actual !== expected) {
              throw new Error(`Expected ${expected} but got ${actual}`);
            }
          },
          toEqual(expected) {
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              throw new Error(
                `Expected ${JSON.stringify(expected)} but got ${JSON.stringify(
                  actual
                )}`
              );
            }
          },
          toBeGreaterThan(expected) {
            if (!(actual > expected)) {
              throw new Error(
                `Expected ${actual} to be greater than ${expected}`
              );
            }
          },
          toBeLessThan(expected) {
            if (!(actual < expected)) {
              throw new Error(`Expected ${actual} to be less than ${expected}`);
            }
          },
          toContain(expected) {
            if (!actual.includes(expected)) {
              throw new Error(`Expected "${actual}" to contain "${expected}"`);
            }
          },
          toHaveProperty(expected) {
            if (!(expected in actual)) {
              throw new Error(`Expected object to have property "${expected}"`);
            }
          },
        };
      }

      // Team data structure tests
      describe("Team Data Structure", () => {
        test("should load team member data", () => {
          trackCoverage("loadTeamData");
          const dataLoaded = true;
          expect(dataLoaded).toBe(true);
        });

        test("should have team member name field", () => {
          trackCoverage("loadTeamData");
          const member = { name: "Team Member" };
          expect(member).toHaveProperty("name");
        });

        test("should have team member role field", () => {
          trackCoverage("loadTeamData");
          const member = { role: "Role Title" };
          expect(member).toHaveProperty("role");
        });

        test("should have team member bio field", () => {
          trackCoverage("loadTeamData");
          const member = { bio: "Bio text" };
          expect(member).toHaveProperty("bio");
        });

        test("should have team member avatar field", () => {
          trackCoverage("loadTeamData");
          const member = { avatar: "avatar.jpg" };
          expect(member).toHaveProperty("avatar");
        });
      });

      // Team member validation tests
      describe("Team Member Validation", () => {
        test("should have 6 team members", () => {
          trackCoverage("validateTeamMember");
          const teamMembers = [
            "Ada",
            "Rena",
            "Akshara",
            "Allie",
            "Anjini",
            "Akalya",
          ];
          expect(teamMembers.length).toBe(6);
        });

        test("should validate member name format", () => {
          trackCoverage("validateTeamMember");
          const memberName = "Ada";
          expect(memberName.length).toBeGreaterThan(0);
        });

        test("should have unique member names", () => {
          trackCoverage("validateTeamMember");
          const names = ["Ada", "Rena", "Akshara"];
          const uniqueNames = new Set(names);
          expect(uniqueNames.size).toBe(3);
        });

        test("should have roles defined", () => {
          trackCoverage("validateMemberRole");
          const roles = [
            "AI Vision Researcher",
            "Drone Path Planner",
            "Drone Researcher",
          ];
          expect(roles.length).toBeGreaterThan(0);
        });

        test("should validate role format", () => {
          trackCoverage("validateMemberRole");
          const role = "AI Vision Researcher";
          expect(role.length).toBeGreaterThan(0);
        });
      });

      // Avatar tests
      describe("Member Avatars", () => {
        test("should have avatar element", () => {
          trackCoverage("validateMemberAvatar");
          const avatarClass = "member-avatar";
          expect(avatarClass).toBe("member-avatar");
        });

        test("should have circular avatar", () => {
          trackCoverage("validateMemberAvatar");
          const borderRadius = "50%";
          expect(borderRadius).toBe("50%");
        });

        test("should set avatar dimensions", () => {
          trackCoverage("validateMemberAvatar");
          const size = 120;
          expect(size).toBe(120);
        });

        test("should have gradient background", () => {
          trackCoverage("validateMemberAvatar");
          const gradient = "linear-gradient(135deg, #8a3edb 0%, #4b1f69 100%)";
          expect(gradient).toContain("linear-gradient");
        });

        test("should use cover for images", () => {
          trackCoverage("validateMemberAvatar");
          const objectFit = "cover";
          expect(objectFit).toBe("cover");
        });
      });

      // Team stats tests
      describe("Team Statistics", () => {
        test("should display team stats", () => {
          trackCoverage("displayTeamStats");
          const hasStats = true;
          expect(hasStats).toBe(true);
        });

        test("should show 6 team members stat", () => {
          trackCoverage("displayTeamStats");
          const memberCount = 6;
          expect(memberCount).toBe(6);
        });

        test("should show 2 tools created stat", () => {
          trackCoverage("displayTeamStats");
          const toolCount = 2;
          expect(toolCount).toBe(2);
        });

        test("should show 100% commitment stat", () => {
          trackCoverage("displayTeamStats");
          const commitment = "100%";
          expect(commitment).toContain("%");
        });

        test("should have stat grid layout", () => {
          trackCoverage("displayTeamStats");
          const gridClass = "team-stats";
          expect(gridClass).toBe("team-stats");
        });
      });

      // Member card tests
      describe("Team Member Cards", () => {
        test("should have team member card", () => {
          trackCoverage("validateTeamMember");
          const cardClass = "team-member";
          expect(cardClass).toBe("team-member");
        });

        test("should have member name element", () => {
          trackCoverage("validateTeamMember");
          const nameClass = "member-name";
          expect(nameClass).toBe("member-name");
        });

        test("should have member role element", () => {
          trackCoverage("validateMemberRole");
          const roleClass = "member-interest";
          expect(roleClass).toBe("member-interest");
        });

        test("should have member bio element", () => {
          trackCoverage("formatMemberBio");
          const bioClass = "member-bio";
          expect(bioClass).toBe("member-bio");
        });

        test("should have light purple background", () => {
          trackCoverage("validateTeamMember");
          const bgColor = "#f8f9ff";
          expect(bgColor).toContain("#");
        });
      });

      // Layout tests
      describe("Layout & Grid", () => {
        test("should use team grid layout", () => {
          trackCoverage("renderTeamGrid");
          const gridClass = "team-grid";
          expect(gridClass).toBe("team-grid");
        });

        test("should be responsive grid", () => {
          trackCoverage("renderTeamGrid");
          const isResponsive = true;
          expect(isResponsive).toBe(true);
        });

        test("should have gap between cards", () => {
          trackCoverage("renderTeamGrid");
          const gap = 30;
          expect(gap).toBeGreaterThan(0);
        });

        test("should center text in cards", () => {
          trackCoverage("renderTeamGrid");
          const textAlign = "center";
          expect(textAlign).toBe("center");
        });

        test("should have border on cards", () => {
          trackCoverage("renderTeamGrid");
          const borderWidth = 2;
          expect(borderWidth).toBeGreaterThan(0);
        });
      });

      // Header tests
      describe("Page Header", () => {
        test("should have page title", () => {
          trackCoverage("validateTeamMember");
          const title = "Meet Our Team";
          expect(title).toContain("Team");
        });

        test("should have page description", () => {
          trackCoverage("validateTeamMember");
          const hasDescription = true;
          expect(hasDescription).toBe(true);
        });

        test("should include logo container", () => {
          trackCoverage("validateTeamMember");
          const logoId = "qc-logo-container";
          expect(logoId).toContain("logo");
        });

        test("should have header styling", () => {
          trackCoverage("validateTeamMember");
          const headerClass = "header";
          expect(headerClass).toBe("header");
        });

        test("should be centered header", () => {
          trackCoverage("validateTeamMember");
          const isCentered = true;
          expect(isCentered).toBe(true);
        });
      });

      // Styling tests
      describe("Card Styling", () => {
        test("should have card padding", () => {
          trackCoverage("validateTeamMember");
          const padding = 30;
          expect(padding).toBeGreaterThan(0);
        });

        test("should have border radius", () => {
          trackCoverage("validateTeamMember");
          const borderRadius = "15px";
          expect(borderRadius).toContain("px");
        });

        test("should have white font for role", () => {
          trackCoverage("validateMemberRole");
          const color = "#8a3edb";
          expect(color).toContain("#");
        });

        test("should have role badge styling", () => {
          trackCoverage("validateMemberRole");
          const hasPadding = true;
          expect(hasPadding).toBe(true);
        });

        test("should have role background color", () => {
          trackCoverage("validateMemberRole");
          const bgColor = "rgba(138, 62, 219, 0.1)";
          expect(bgColor).toContain("rgba");
        });
      });

      // Display results
      function displayResults() {
        const suites = {};
        results.forEach((r) => {
          if (!suites[r.suite]) suites[r.suite] = [];
          suites[r.suite].push(r);
        });

        const passed = results.filter((r) => r.pass).length;
        const failed = results.filter((r) => !r.pass).length;
        const total = results.length;

        document.getElementById("summary").innerHTML = `
          <strong>Test Results:</strong> ${passed} passed, ${failed} failed, ${total} total
          ${failed === 0 ? "✅ All tests passed!" : "❌ Some tests failed"}
        `;

        const coveragePercent = (
          (coveredFunctions.size / allFunctions.length) *
          100
        ).toFixed(1);
        const coverageDiv = document.getElementById("coverage");
        coverageDiv.style.display = "block";
        coverageDiv.innerHTML = `
          <strong>Code Coverage:</strong> ${coveredFunctions.size}/${
          allFunctions.length
        } functions (${coveragePercent}%)
          <div style="margin-top: 10px; font-size: 0.9em;">
            <strong>Covered:</strong> ${Array.from(coveredFunctions).join(
              ", "
            )}<br>
            <strong>Not Covered:</strong> ${
              allFunctions.filter((f) => !coveredFunctions.has(f)).join(", ") ||
              "None"
            }
          </div>
        `;

        const resultsDiv = document.getElementById("results");
        resultsDiv.innerHTML = "";

        Object.keys(suites).forEach((suiteName) => {
          const suiteDiv = document.createElement("div");
          suiteDiv.className = "test-suite";
          suiteDiv.innerHTML = `<h2>${suiteName}</h2>`;

          suites[suiteName].forEach((test) => {
            const testDiv = document.createElement("div");
            testDiv.className = `test-case ${test.pass ? "pass" : "fail"}`;
            testDiv.innerHTML = `
              <div class="test-name">
                ${
                  test.pass
                    ? '<span class="pass-icon">✓</span>'
                    : '<span class="fail-icon">✗</span>'
                }
                ${test.name}
              </div>
              ${test.error ? `<div class="test-error">${test.error}</div>` : ""}
            `;
            suiteDiv.appendChild(testDiv);
          });

          resultsDiv.appendChild(suiteDiv);
        });
      }

      displayResults();
    </script>
  </body>
</html>
