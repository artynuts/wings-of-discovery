<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consolidated Test Runner - Wings of Discovery</title>
    <link rel="stylesheet" href="test-runner-styles.css" />
  </head>
  <body>
    <div class="header">
      <div class="test-badge">🧪 Consolidated Test Runner</div>
      <h1 class="header-title">Wings of Discovery - All Tests</h1>
      <p class="header-subtitle">Run All 9 Test Suites at Once</p>
      <p class="header-description">
        Execute all unit tests across all pages in a single consolidated
        dashboard
      </p>
    </div>

    <div class="container">
      <div
        class="consolidated-stats-grid"
        style="
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
          gap: 15px;
          margin-bottom: 30px;
        "
      >
        <div class="stat-card">
          <div class="stat-number" id="totalTests">0</div>
          <div class="stat-label">Total Tests</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="passedTests">0</div>
          <div class="stat-label">Passed</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="failedTests">0</div>
          <div class="stat-label">Failed</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="passRate">0%</div>
          <div class="stat-label">Pass Rate</div>
        </div>
      </div>

      <div class="controls">
        <button onclick="runAllTests()">▶ Run All Tests</button>
        <button onclick="clearResults()">⟲ Clear Results</button>
      </div>

      <div class="view-toggle">
        <button class="view-btn active" onclick="setView('by-file')">
          View by File
        </button>
        <button class="view-btn" onclick="setView('by-suite')">
          View by Suite
        </button>
        <button class="view-btn" onclick="setView('failures-only')">
          Failures Only
        </button>
      </div>

      <div id="loading" class="loading" style="display: none">
        Running tests...
      </div>
      <div id="test-results" class="test-suites-container"></div>
      <div id="summary" class="summary hidden">
        <div id="summary-text"></div>
      </div>
    </div>

    <script>
      const TestManager = {
        allResults: [],
        currentView: "by-file",

        clearResults() {
          this.allResults = [];
          document.getElementById("test-results").innerHTML = "";
          document.getElementById("summary").classList.add("hidden");
        },

        updateStats() {
          const total = this.allResults.length;
          const passed = this.allResults.filter((r) => r.pass).length;
          const failed = total - passed;
          const rate = total === 0 ? 0 : Math.round((passed / total) * 100);

          document.getElementById("totalTests").textContent = total;
          document.getElementById("passedTests").textContent = passed;
          document.getElementById("failedTests").textContent = failed;
          document.getElementById("passRate").textContent = rate + "%";
        },

        renderResults() {
          const resultsDiv = document.getElementById("test-results");
          resultsDiv.innerHTML = "";

          if (this.currentView === "by-file") {
            this.renderByFile(resultsDiv);
          } else if (this.currentView === "by-suite") {
            this.renderBySuite(resultsDiv);
          } else if (this.currentView === "failures-only") {
            this.renderFailuresOnly(resultsDiv);
          }

          this.renderSummary();
        },

        renderByFile(resultsDiv) {
          const byFile = {};
          this.allResults.forEach((result) => {
            if (!byFile[result.file]) byFile[result.file] = [];
            byFile[result.file].push(result);
          });

          Object.entries(byFile).forEach(([file, results]) => {
            resultsDiv.appendChild(this.createFileSection(file, results));
          });
        },

        renderBySuite(resultsDiv) {
          const bySuite = {};
          this.allResults.forEach((result) => {
            const key = `${result.file} - ${result.suite}`;
            if (!bySuite[key]) bySuite[key] = [];
            bySuite[key].push(result);
          });

          Object.entries(bySuite).forEach(([suiteKey, results]) => {
            const [file, suite] = suiteKey.split(" - ");
            const div = document.createElement("div");
            div.className = "test-file-section";
            div.innerHTML = `<div class="file-header"><div><div class="file-name">${suite}</div><div class="file-stats">from ${file}</div></div></div>`;
            const testSuite = document.createElement("div");
            testSuite.className = "test-suite";
            results.forEach((result) =>
              testSuite.appendChild(this.createTestCase(result))
            );
            div.appendChild(testSuite);
            resultsDiv.appendChild(div);
          });
        },

        renderFailuresOnly(resultsDiv) {
          const failures = this.allResults.filter((r) => !r.pass);
          if (failures.length === 0) {
            const div = document.createElement("div");
            div.style.gridColumn = "1 / -1";
            div.style.textAlign = "center";
            div.style.padding = "40px";
            div.innerHTML =
              '<h2 style="color: #27ae60; font-size: 1.5em;">✓ All Tests Passed!</h2>';
            resultsDiv.appendChild(div);
            return;
          }

          const byFile = {};
          failures.forEach((result) => {
            if (!byFile[result.file]) byFile[result.file] = [];
            byFile[result.file].push(result);
          });

          Object.entries(byFile).forEach(([file, results]) => {
            resultsDiv.appendChild(this.createFileSection(file, results));
          });
        },

        createFileSection(file, results) {
          const section = document.createElement("div");
          section.className = "test-file-section";
          const icon = this.getFileIcon(file);
          const passed = results.filter((r) => r.pass).length;
          const total = results.length;

          const header = document.createElement("div");
          header.className = "file-header";
          header.innerHTML = `<div class="file-icon">${icon}</div><div><div class="file-name">${file}</div><div class="file-stats">${passed}/${total} tests passed</div></div>`;
          section.appendChild(header);

          const bySuite = {};
          results.forEach((result) => {
            if (!bySuite[result.suite]) bySuite[result.suite] = [];
            bySuite[result.suite].push(result);
          });

          Object.entries(bySuite).forEach(([suite, suiteResults]) => {
            const suiteDiv = document.createElement("div");
            suiteDiv.className = "test-suite";
            const suiteName = document.createElement("div");
            suiteName.className = "suite-name";
            suiteName.textContent = suite;
            suiteDiv.appendChild(suiteName);
            suiteResults.forEach((result) =>
              suiteDiv.appendChild(this.createTestCase(result))
            );
            section.appendChild(suiteDiv);
          });

          return section;
        },

        createTestCase(result) {
          const div = document.createElement("div");
          div.className = `test-case ${result.pass ? "pass" : "fail"}`;
          const name = document.createElement("div");
          name.className = "test-name";
          name.innerHTML = `<span class="${
            result.pass ? "pass-icon" : "fail-icon"
          }"></span>${result.name}`;
          div.appendChild(name);
          if (!result.pass && result.error) {
            const error = document.createElement("div");
            error.className = "test-error";
            error.textContent = result.error;
            div.appendChild(error);
          }
          return div;
        },

        renderSummary() {
          const total = this.allResults.length;
          const passed = this.allResults.filter((r) => r.pass).length;
          const failed = total - passed;
          const rate = total === 0 ? 0 : Math.round((passed / total) * 100);
          const summaryDiv = document.getElementById("summary");
          const summaryText = document.getElementById("summary-text");

          if (total === 0) {
            summaryDiv.classList.add("hidden");
            return;
          }

          summaryDiv.classList.remove("hidden");
          if (failed === 0) {
            summaryDiv.classList.add("success");
            summaryDiv.classList.remove("failure");
            summaryText.innerHTML = `✓ All ${total} tests passed! (${rate}%)`;
          } else {
            summaryDiv.classList.add("failure");
            summaryDiv.classList.remove("success");
            summaryText.innerHTML = `✗ ${failed} of ${total} tests failed (${rate}% pass rate)`;
          }
        },

        getFileIcon(file) {
          const icons = {
            "Find Artifacts": "🔍",
            "Plan Drone Path": "📍",
            "Learn Archaeology": "🎓",
            "Drone Selection": "🚁",
            "AI Image Detection": "🧠",
            "Home Page": "🏠",
            "Real World Examples": "🌍",
            "Team Page": "👥",
            "Survey Results": "📊",
          };
          return icons[file] || "📄";
        },
      };

      function expect(actual) {
        return {
          toBe(expected) {
            if (actual !== expected)
              throw new Error(`Expected ${expected} but got ${actual}`);
          },
          toEqual(expected) {
            if (JSON.stringify(actual) !== JSON.stringify(expected))
              throw new Error(
                `Expected ${JSON.stringify(expected)} but got ${JSON.stringify(
                  actual
                )}`
              );
          },
          toBeGreaterThan(expected) {
            if (!(actual > expected))
              throw new Error(
                `Expected ${actual} to be greater than ${expected}`
              );
          },
          toBeLessThan(expected) {
            if (!(actual < expected))
              throw new Error(`Expected ${actual} to be less than ${expected}`);
          },
          toContain(expected) {
            if (!actual.includes(expected))
              throw new Error(`Expected "${actual}" to contain "${expected}"`);
          },
          toHaveProperty(expected) {
            if (!(expected in actual))
              throw new Error(`Expected object to have property "${expected}"`);
          },
          toBeNull() {
            if (actual !== null)
              throw new Error(`Expected null but got ${actual}`);
          },
        };
      }

      let currentFile = "";
      let currentSuite = "";

      function describe(name, fn) {
        currentSuite = name;
        fn();
      }

      function test(name, fn) {
        try {
          fn();
          TestManager.allResults.push({
            file: currentFile,
            suite: currentSuite,
            name: name,
            pass: true,
          });
        } catch (error) {
          TestManager.allResults.push({
            file: currentFile,
            suite: currentSuite,
            name: name,
            pass: false,
            error: error.message,
          });
        }
      }

      function runFindArtifactsTests() {
        currentFile = "Find Artifacts";
        describe("Model Initialization", () => {
          test("should construct correct model URL with trailing slash", () => {
            const modelURL = "https://example.com/model";
            const finalURL = modelURL.endsWith("/") ? modelURL : modelURL + "/";
            expect(finalURL).toBe("https://example.com/model/");
          });
          test("should construct correct model.json path", () => {
            expect("https://example.com/model/" + "model.json").toBe(
              "https://example.com/model/model.json"
            );
          });
        });
        describe("File Selection Handling", () => {
          test("should convert FileList to array", () => {
            const files = Array.from([
              { name: "test1.jpg" },
              { name: "test2.jpg" },
            ]);
            expect(files.length).toBe(2);
          });
        });
        describe("File Processing", () => {
          test("should filter image files", () => {
            const files = [
              { name: "photo.jpg" },
              { name: "document.pdf" },
              { name: "image.png" },
            ];
            const imgs = files.filter((f) =>
              [".jpg", ".png"].some((ext) => f.name.endsWith(ext))
            );
            expect(imgs.length).toBe(2);
          });
        });
      }

      function runPlanPathTests() {
        currentFile = "Plan Drone Path";
        describe("Polygon Management", () => {
          test("should add point to polygon", () => {
            const polygon = [];
            polygon.push({ x: 10, y: 20 });
            expect(polygon.length).toBe(1);
          });
        });
        describe("Path Generation", () => {
          test("should calculate flight distance", () => {
            const distance = Math.sqrt(Math.pow(3, 2) + Math.pow(4, 2));
            expect(distance).toBe(5);
          });
        });
      }

      function runLearnArchaeologyTests() {
        currentFile = "Learn Archaeology";
        describe("Quiz Logic", () => {
          test("should initialize quiz", () => {
            const quiz = { questions: [{ id: 1 }] };
            expect(quiz.questions.length).toBe(1);
          });
        });
        describe("Scoring", () => {
          test("should calculate score", () => {
            const score = [true, true, false].filter((a) => a).length;
            expect(score).toBe(2);
          });
        });
      }

      function runDroneSelectionTests() {
        currentFile = "Drone Selection";
        describe("Drone Specs", () => {
          test("should store flight time", () => {
            expect({ flightTime: 13 }.flightTime).toBe(13);
          });
        });
      }

      function runAIImageDetectionTests() {
        currentFile = "AI Image Detection";
        describe("Model Training", () => {
          test("should define artifact classes", () => {
            expect(["pottery", "coins", "jewelry"].length).toBe(3);
          });
        });
      }

      function runHomePageTests() {
        currentFile = "Home Page";
        describe("Page Structure", () => {
          test("should have header", () => {
            expect(document.querySelector("h1") !== null).toBe(true);
          });
        });
      }

      function runRealWorldExamplesTests() {
        currentFile = "Real World Examples";
        describe("Example Cards", () => {
          test("should store location", () => {
            const ex = { location: "Rome" };
            expect(ex).toHaveProperty("location");
          });
        });
      }

      function runTeamPageTests() {
        currentFile = "Team Page";
        describe("Team Members", () => {
          test("should have team list", () => {
            expect([1, 2, 3].length).toBe(3);
          });
        });
      }

      function runSurveyResultsTests() {
        currentFile = "Survey Results";
        describe("Survey", () => {
          test("should have questions", () => {
            expect(["Q1", "Q2"].length).toBe(2);
          });
        });
      }

      async function runAllTests() {
        document.getElementById("loading").style.display = "block";
        TestManager.clearResults();
        runFindArtifactsTests();
        runPlanPathTests();
        runLearnArchaeologyTests();
        runDroneSelectionTests();
        runAIImageDetectionTests();
        runHomePageTests();
        runRealWorldExamplesTests();
        runTeamPageTests();
        runSurveyResultsTests();
        document.getElementById("loading").style.display = "none";
        TestManager.updateStats();
        TestManager.renderResults();
      }

      function clearResults() {
        TestManager.clearResults();
        document.getElementById("totalTests").textContent = "0";
        document.getElementById("passedTests").textContent = "0";
        document.getElementById("failedTests").textContent = "0";
        document.getElementById("passRate").textContent = "0%";
      }

      function setView(view) {
        TestManager.currentView = view;
        document
          .querySelectorAll(".view-toggle .view-btn")
          .forEach((btn) => btn.classList.remove("active"));
        event.target.classList.add("active");
        TestManager.renderResults();
      }

      // Run tests on load
      window.addEventListener("load", runAllTests);
    </script>
  </body>
</html>
