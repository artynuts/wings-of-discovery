<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consolidated Test Runner - Wings of Discovery</title>
  <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(
          135deg,
          #1a1a2e 0%,
          #16213e 50%,
          #0f3460 100%
        );
        color: #fff;
        min-height: 100vh;
        padding: 20px;
      }

      .header {
        text-align: center;
        margin-bottom: 50px;
        padding-top: 20px;
      }

      .header-title {
        font-size: 3em;
        font-weight: 800;
        background: linear-gradient(135deg, #8a3edb, #d584ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 10px;
        text-shadow: 0 0 20px rgba(138, 62, 219, 0.3);
      }

      .header-subtitle {
        font-size: 1.2em;
        color: #aaa;
        margin-bottom: 5px;
        font-weight: 500;
      }

      .header-description {
        color: #888;
        font-size: 0.95em;
        margin-bottom: 30px;
      }

      .test-badge {
        display: inline-block;
        background: linear-gradient(135deg, #8a3edb, #5a1db8);
        padding: 10px 20px;
        border-radius: 25px;
        font-size: 0.85em;
        font-weight: 600;
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .test-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 25px;
        margin-bottom: 50px;
      }

      .test-card {
        background: linear-gradient(
          135deg,
          rgba(138, 62, 219, 0.1),
          rgba(212, 132, 255, 0.05)
        );
        border: 2px solid rgba(138, 62, 219, 0.3);
        border-radius: 15px;
        padding: 30px;
        text-align: center;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        text-decoration: none;
        color: inherit;
        backdrop-filter: blur(10px);
        position: relative;
        overflow: hidden;
      }

      .test-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.1),
          transparent
        );
        transition: left 0.5s;
      }

      .test-card:hover::before {
        left: 100%;
      }

      .test-card:hover {
        border-color: #8a3edb;
        box-shadow: 0 0 30px rgba(138, 62, 219, 0.4),
          inset 0 0 20px rgba(138, 62, 219, 0.1);
        transform: translateY(-8px);
        background: linear-gradient(
          135deg,
          rgba(138, 62, 219, 0.2),
          rgba(212, 132, 255, 0.1)
        );
      }

      .test-icon {
        font-size: 3.5em;
        margin-bottom: 15px;
        display: block;
        filter: drop-shadow(0 0 10px rgba(138, 62, 219, 0.3));
      }

      .test-name {
        font-size: 1.4em;
        font-weight: 700;
        color: #fff;
        margin-bottom: 12px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      }

      .test-description {
        color: #aaa;
        font-size: 0.95em;
        line-height: 1.6;
        margin-bottom: 15px;
      }

      .test-status {
        display: inline-block;
        background: linear-gradient(135deg, #27ae60, #229954);
        color: #fff;
        padding: 8px 18px;
        border-radius: 20px;
        font-size: 0.85em;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .info-box {
        background: linear-gradient(
          135deg,
          rgba(138, 62, 219, 0.1),
          rgba(212, 132, 255, 0.05)
        );
        border-left: 4px solid #8a3edb;
        border-radius: 12px;
        padding: 25px;
        margin-top: 30px;
        color: #ddd;
        line-height: 1.7;
        backdrop-filter: blur(10px);
        border: 2px solid rgba(138, 62, 219, 0.2);
      }

      .info-box h3 {
        color: #fff;
        margin-top: 0;
        margin-bottom: 12px;
        font-size: 1.1em;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .info-box ul {
        margin: 10px 0;
        padding-left: 20px;
      }

      .info-box li {
        margin-bottom: 10px;
      }

      .info-box strong {
        color: #d584ff;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-top: 40px;
      }

      .stat-card {
        background: linear-gradient(
          135deg,
          rgba(39, 174, 96, 0.1),
          rgba(46, 204, 113, 0.05)
        );
        border: 2px solid rgba(39, 174, 96, 0.3);
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        backdrop-filter: blur(10px);
      }

      .stat-number {
        font-size: 2.5em;
        font-weight: 800;
        color: #27ae60;
        margin-bottom: 8px;
      }

      .stat-label {
        color: #aaa;
        font-size: 0.9em;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
    .controls {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(138, 62, 219, 0.1);
      border: 2px solid rgba(138, 62, 219, 0.3);
      border-radius: 12px;
    }

    .controls button {
      background: linear-gradient(135deg, #8a3edb, #d584ff);
      border: none;
      color: white;
      padding: 12px 30px;
      font-size: 1em;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      margin: 0 10px;
      transition: all 0.3s;
    }

    .controls button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(138, 62, 219, 0.4);
    }

    .view-toggle {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .view-btn {
      background: rgba(138, 62, 219, 0.2);
      border: 2px solid rgba(138, 62, 219, 0.3);
      color: #aaa;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9em;
      transition: all 0.3s;
    }

    .view-btn.active {
      background: linear-gradient(135deg, #8a3edb, #d584ff);
      color: white;
      border-color: transparent;
    }

    .test-suites-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 25px;
      margin-bottom: 40px;
    }

    .test-file-section {
      background: linear-gradient(135deg, rgba(138, 62, 219, 0.1), rgba(212, 132, 255, 0.05));
      border: 2px solid rgba(138, 62, 219, 0.3);
      border-radius: 15px;
      padding: 25px;
      backdrop-filter: blur(10px);
    }

    .file-header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid rgba(138, 62, 219, 0.2);
    }

    .file-icon {
      font-size: 2em;
      margin-right: 15px;
    }

    .file-name {
      font-size: 1.3em;
      font-weight: 700;
      color: #fff;
    }

    .file-stats {
      font-size: 0.85em;
      color: #aaa;
      margin-top: 5px;
    }

    .test-suite {
      margin-bottom: 20px;
    }

    .suite-name {
      font-size: 0.95em;
      font-weight: 600;
      color: #d584ff;
      margin-bottom: 10px;
      padding-left: 10px;
      border-left: 3px solid #d584ff;
    }

    .test-case {
      margin-left: 15px;
      padding: 10px;
      margin-bottom: 8px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      font-size: 0.9em;
      border-left: 3px solid transparent;
      transition: all 0.2s;
    }

    .test-case.pass {
      border-left-color: #27ae60;
      background: rgba(39, 174, 96, 0.1);
    }

    .test-case.fail {
      border-left-color: #e74c3c;
      background: rgba(231, 76, 60, 0.1);
    }

    .test-case .test-name {
      font-size: 1em;
      font-weight: 500;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0;
      text-shadow: none;
    }

    .pass-icon::before {
      content: "✓";
      color: #27ae60;
      font-weight: bold;
    }

    .fail-icon::before {
      content: "✗";
      color: #e74c3c;
      font-weight: bold;
    }

    .test-error {
      color: #ff6b6b;
      font-size: 0.85em;
      margin-top: 8px;
      padding: 8px;
      background: rgba(255, 107, 107, 0.1);
      border-radius: 4px;
      border-left: 2px solid #ff6b6b;
    }

    .summary {
      background: linear-gradient(135deg, rgba(138, 62, 219, 0.15), rgba(212, 132, 255, 0.08));
      border: 2px solid rgba(138, 62, 219, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-top: 30px;
      text-align: center;
      font-weight: 600;
    }

    .summary.success {
      background: linear-gradient(135deg, rgba(39, 174, 96, 0.15), rgba(46, 204, 113, 0.08));
      border-color: rgba(39, 174, 96, 0.3);
    }

    .summary.failure {
      background: linear-gradient(135deg, rgba(231, 76, 60, 0.15), rgba(255, 107, 107, 0.08));
      border-color: rgba(231, 76, 60, 0.3);
    }

    .loading {
      text-align: center;
      font-size: 1.2em;
      color: #aaa;
      padding: 40px;
    }

    .hidden {
      display: none !important;
    }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="test-badge">🧪 Consolidated Test Runner</div>
      <h1 class="header-title">Wings of Discovery - All Tests</h1>
      <p class="header-subtitle">Run All 9 Test Suites at Once</p>
      <p class="header-description">
        Execute all unit tests across all pages in a single consolidated dashboard
      </p>
    </div>

    <div class="container">
      <div class="consolidated-stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 30px;">
        <div class="stat-card">
          <div class="stat-number" id="totalTests">0</div>
          <div class="stat-label">Total Tests</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="passedTests">0</div>
          <div class="stat-label">Passed</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="failedTests">0</div>
          <div class="stat-label">Failed</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="passRate">0%</div>
          <div class="stat-label">Pass Rate</div>
        </div>
      </div>

      <div class="controls">
        <button onclick="runAllTests()">▶ Run All Tests</button>
        <button onclick="clearResults()">⟲ Clear Results</button>
      </div>

      <div class="view-toggle">
        <button class="view-btn active" onclick="setView('by-file')">View by File</button>
        <button class="view-btn" onclick="setView('by-suite')">View by Suite</button>
        <button class="view-btn" onclick="setView('failures-only')">Failures Only</button>
      </div>

      <div id="loading" class="loading" style="display: none">Running tests...</div>
      <div id="test-results" class="test-suites-container"></div>
      <div id="summary" class="summary hidden"><div id="summary-text"></div></div>
    </div>

    <script>
      const TestManager = {
        allResults: [],
        currentView: "by-file",

        clearResults() {
          this.allResults = [];
          document.getElementById("test-results").innerHTML = "";
          document.getElementById("summary").classList.add("hidden");
        },

        updateStats() {
          const total = this.allResults.length;
          const passed = this.allResults.filter((r) => r.pass).length;
          const failed = total - passed;
          const rate = total === 0 ? 0 : Math.round((passed / total) * 100);

          document.getElementById("totalTests").textContent = total;
          document.getElementById("passedTests").textContent = passed;
          document.getElementById("failedTests").textContent = failed;
          document.getElementById("passRate").textContent = rate + "%";
        },

        renderResults() {
          const resultsDiv = document.getElementById("test-results");
          resultsDiv.innerHTML = "";

          if (this.currentView === "by-file") {
            this.renderByFile(resultsDiv);
          } else if (this.currentView === "by-suite") {
            this.renderBySuite(resultsDiv);
          } else if (this.currentView === "failures-only") {
            this.renderFailuresOnly(resultsDiv);
          }

          this.renderSummary();
        },

        renderByFile(resultsDiv) {
          const byFile = {};
          this.allResults.forEach((result) => {
            if (!byFile[result.file]) byFile[result.file] = [];
            byFile[result.file].push(result);
          });

          Object.entries(byFile).forEach(([file, results]) => {
            resultsDiv.appendChild(this.createFileSection(file, results));
          });
        },

        renderBySuite(resultsDiv) {
          const bySuite = {};
          this.allResults.forEach((result) => {
            const key = `${result.file} - ${result.suite}`;
            if (!bySuite[key]) bySuite[key] = [];
            bySuite[key].push(result);
          });

          Object.entries(bySuite).forEach(([suiteKey, results]) => {
            const [file, suite] = suiteKey.split(" - ");
            const div = document.createElement("div");
            div.className = "test-file-section";
            div.innerHTML = `<div class="file-header"><div><div class="file-name">${suite}</div><div class="file-stats">from ${file}</div></div></div>`;
            const testSuite = document.createElement("div");
            testSuite.className = "test-suite";
            results.forEach((result) => testSuite.appendChild(this.createTestCase(result)));
            div.appendChild(testSuite);
            resultsDiv.appendChild(div);
          });
        },

        renderFailuresOnly(resultsDiv) {
          const failures = this.allResults.filter((r) => !r.pass);
          if (failures.length === 0) {
            const div = document.createElement("div");
            div.style.gridColumn = "1 / -1";
            div.style.textAlign = "center";
            div.style.padding = "40px";
            div.innerHTML = '<h2 style="color: #27ae60; font-size: 1.5em;">✓ All Tests Passed!</h2>';
            resultsDiv.appendChild(div);
            return;
          }

          const byFile = {};
          failures.forEach((result) => {
            if (!byFile[result.file]) byFile[result.file] = [];
            byFile[result.file].push(result);
          });

          Object.entries(byFile).forEach(([file, results]) => {
            resultsDiv.appendChild(this.createFileSection(file, results));
          });
        },

        createFileSection(file, results) {
          const section = document.createElement("div");
          section.className = "test-file-section";
          const icon = this.getFileIcon(file);
          const passed = results.filter((r) => r.pass).length;
          const total = results.length;

          const header = document.createElement("div");
          header.className = "file-header";
          header.innerHTML = `<div class="file-icon">${icon}</div><div><div class="file-name">${file}</div><div class="file-stats">${passed}/${total} tests passed</div></div>`;
          section.appendChild(header);

          const bySuite = {};
          results.forEach((result) => {
            if (!bySuite[result.suite]) bySuite[result.suite] = [];
            bySuite[result.suite].push(result);
          });

          Object.entries(bySuite).forEach(([suite, suiteResults]) => {
            const suiteDiv = document.createElement("div");
            suiteDiv.className = "test-suite";
            const suiteName = document.createElement("div");
            suiteName.className = "suite-name";
            suiteName.textContent = suite;
            suiteDiv.appendChild(suiteName);
            suiteResults.forEach((result) => suiteDiv.appendChild(this.createTestCase(result)));
            section.appendChild(suiteDiv);
          });

          return section;
        },

        createTestCase(result) {
          const div = document.createElement("div");
          div.className = `test-case ${result.pass ? "pass" : "fail"}`;
          const name = document.createElement("div");
          name.className = "test-name";
          name.innerHTML = `<span class="${result.pass ? "pass-icon" : "fail-icon"}"></span>${result.name}`;
          div.appendChild(name);
          if (!result.pass && result.error) {
            const error = document.createElement("div");
            error.className = "test-error";
            error.textContent = result.error;
            div.appendChild(error);
          }
          return div;
        },

        renderSummary() {
          const total = this.allResults.length;
          const passed = this.allResults.filter((r) => r.pass).length;
          const failed = total - passed;
          const rate = total === 0 ? 0 : Math.round((passed / total) * 100);
          const summaryDiv = document.getElementById("summary");
          const summaryText = document.getElementById("summary-text");

          if (total === 0) {
            summaryDiv.classList.add("hidden");
            return;
          }

          summaryDiv.classList.remove("hidden");
          if (failed === 0) {
            summaryDiv.classList.add("success");
            summaryDiv.classList.remove("failure");
            summaryText.innerHTML = `✓ All ${total} tests passed! (${rate}%)`;
          } else {
            summaryDiv.classList.add("failure");
            summaryDiv.classList.remove("success");
            summaryText.innerHTML = `✗ ${failed} of ${total} tests failed (${rate}% pass rate)`;
          }
        },

        getFileIcon(file) {
          const icons = {
            "Find Artifacts": "🔍",
            "Plan Drone Path": "📍",
            "Learn Archaeology": "🎓",
            "Drone Selection": "🚁",
            "AI Image Detection": "🧠",
            "Home Page": "🏠",
            "Real World Examples": "🌍",
            "Team Page": "👥",
            "Survey Results": "📊",
          };
          return icons[file] || "📄";
        },
      };

      function expect(actual) {
        return {
          toBe(expected) {
            if (actual !== expected) throw new Error(`Expected ${expected} but got ${actual}`);
          },
          toEqual(expected) {
            if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`Expected ${JSON.stringify(expected)} but got ${JSON.stringify(actual)}`);
          },
          toBeGreaterThan(expected) {
            if (!(actual > expected)) throw new Error(`Expected ${actual} to be greater than ${expected}`);
          },
          toBeLessThan(expected) {
            if (!(actual < expected)) throw new Error(`Expected ${actual} to be less than ${expected}`);
          },
          toContain(expected) {
            if (!actual.includes(expected)) throw new Error(`Expected "${actual}" to contain "${expected}"`);
          },
          toHaveProperty(expected) {
            if (!(expected in actual)) throw new Error(`Expected object to have property "${expected}"`);
          },
          toBeNull() {
            if (actual !== null) throw new Error(`Expected null but got ${actual}`);
          },
        };
      }

      let currentFile = "";
      let currentSuite = "";

      function describe(name, fn) {
        currentSuite = name;
        fn();
      }

      function test(name, fn) {
        try {
          fn();
          TestManager.allResults.push({file: currentFile, suite: currentSuite, name: name, pass: true});
        } catch (error) {
          TestManager.allResults.push({file: currentFile, suite: currentSuite, name: name, pass: false, error: error.message});
        }
      }

      function runFindArtifactsTests() {
        currentFile = "Find Artifacts";
        describe("Model Initialization", () => {
          test("should construct correct model URL with trailing slash", () => {
            const modelURL = "https://example.com/model";
            const finalURL = modelURL.endsWith("/") ? modelURL : modelURL + "/";
            expect(finalURL).toBe("https://example.com/model/");
          });
          test("should construct correct model.json path", () => {
            expect("https://example.com/model/" + "model.json").toBe("https://example.com/model/model.json");
          });
        });
        describe("File Selection Handling", () => {
          test("should convert FileList to array", () => {
            const files = Array.from([{ name: "test1.jpg" }, { name: "test2.jpg" }]);
            expect(files.length).toBe(2);
          });
        });
        describe("File Processing", () => {
          test("should filter image files", () => {
            const files = [{ name: "photo.jpg" }, { name: "document.pdf" }, { name: "image.png" }];
            const imgs = files.filter(f => [".jpg", ".png"].some(ext => f.name.endsWith(ext)));
            expect(imgs.length).toBe(2);
          });
        });
      }

      function runPlanPathTests() {
        currentFile = "Plan Drone Path";
        describe("Polygon Management", () => {
          test("should add point to polygon", () => {
            const polygon = []; polygon.push({ x: 10, y: 20 });
            expect(polygon.length).toBe(1);
          });
        });
        describe("Path Generation", () => {
          test("should calculate flight distance", () => {
            const distance = Math.sqrt(Math.pow(3, 2) + Math.pow(4, 2));
            expect(distance).toBe(5);
          });
        });
      }

      function runLearnArchaeologyTests() {
        currentFile = "Learn Archaeology";
        describe("Quiz Logic", () => {
          test("should initialize quiz", () => {
            const quiz = { questions: [{id: 1}] };
            expect(quiz.questions.length).toBe(1);
          });
        });
        describe("Scoring", () => {
          test("should calculate score", () => {
            const score = [true, true, false].filter(a => a).length;
            expect(score).toBe(2);
          });
        });
      }

      function runDroneSelectionTests() {
        currentFile = "Drone Selection";
        describe("Drone Specs", () => {
          test("should store flight time", () => {
            expect({ flightTime: 13 }.flightTime).toBe(13);
          });
        });
      }

      function runAIImageDetectionTests() {
        currentFile = "AI Image Detection";
        describe("Model Training", () => {
          test("should define artifact classes", () => {
            expect(["pottery", "coins", "jewelry"].length).toBe(3);
          });
        });
      }

      function runHomePageTests() {
        currentFile = "Home Page";
        describe("Page Structure", () => {
          test("should have header", () => {
            expect(document.querySelector("h1") !== null).toBe(true);
          });
        });
      }

      function runRealWorldExamplesTests() {
        currentFile = "Real World Examples";
        describe("Example Cards", () => {
          test("should store location", () => {
            const ex = { location: "Rome" };
            expect(ex).toHaveProperty("location");
          });
        });
      }

      function runTeamPageTests() {
        currentFile = "Team Page";
        describe("Team Members", () => {
          test("should have team list", () => {
            expect([1, 2, 3].length).toBe(3);
          });
        });
      }

      function runSurveyResultsTests() {
        currentFile = "Survey Results";
        describe("Survey", () => {
          test("should have questions", () => {
            expect(["Q1", "Q2"].length).toBe(2);
          });
        });
      }

      async function runAllTests() {
        document.getElementById("loading").style.display = "block";
        TestManager.clearResults();
        runFindArtifactsTests();
        runPlanPathTests();
        runLearnArchaeologyTests();
        runDroneSelectionTests();
        runAIImageDetectionTests();
        runHomePageTests();
        runRealWorldExamplesTests();
        runTeamPageTests();
        runSurveyResultsTests();
        document.getElementById("loading").style.display = "none";
        TestManager.updateStats();
        TestManager.renderResults();
      }

      function clearResults() {
        TestManager.clearResults();
        document.getElementById("totalTests").textContent = "0";
        document.getElementById("passedTests").textContent = "0";
        document.getElementById("failedTests").textContent = "0";
        document.getElementById("passRate").textContent = "0%";
      }

      function setView(view) {
        TestManager.currentView = view;
        document.querySelectorAll(".view-toggle .view-btn").forEach(btn => btn.classList.remove("active"));
        event.target.classList.add("active");
        TestManager.renderResults();
      }

      // Run tests on load
      window.addEventListener('load', runAllTests);
    </script>
  </body>
</html>
